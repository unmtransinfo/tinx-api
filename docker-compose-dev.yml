name: tinx-dev
services:
  tinx_ui:
    build:
      context: ../tinx-ui/
    volumes:
      - ../tinx-ui:/app
    env_file:
      - .env
    ports:
      - "${TINX_UI_HTTP_PORT:-8080}:8080"
    command: sh -c "npm i && npm run dev"
  tinx_api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tinxapi/tinxapi/secrets.example.py:/tinx/tinxapi/tinxapi/secrets.py
      - ./:/tinx
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
    ports:
      - "${TINX_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
    image: unmtransinfo/tinx_db:3.0
    volumes:
      - tinx-mysql-data:/var/lib/mysql
      - ./mysql-tuning.cnf:/etc/mysql/conf.d/tuning.cnf:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS}"
          memory: "${DB_MEMORY}"
  solr:
    image: solr:6.6.6
    volumes:
      - solr_data:/opt/solr/server/solr/mycores
      - ./tinxapi/managed-schema:/opt/solr/server/solr/configsets/basic_configs/conf/managed-schema:ro
    command: solr-precreate haystack /opt/solr/server/solr/configsets/basic_configs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8983/solr/haystack/admin/ping || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  tinx-mysql-data:
  solr_data:
