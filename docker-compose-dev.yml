name: tinx-dev
services:
  db:
    image: unmtransinfo/tinx_db:3.1
    volumes:
      - tinx-mysql-data:/var/lib/mysql
      - ./mysql-tuning.cnf:/etc/mysql/conf.d/tuning.cnf:ro
    env_file: .env
    # don't need to expose ports here, but it may be convenient to access the db from the localhost rather than having to docker exec into the container
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:3306"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mysql -u$$DB_USER -p$$DB_PASSWORD -e 'SELECT 1' $$MYSQL_DATABASE" ]
      interval: 30s
      timeout: 10s
      # 1440x30s=12 hrs of tolerance
      retries: 1440
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS}"
          memory: "${DB_MEMORY}"
  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tinxapi/tinxapi/secrets.example.py:/tinx/tinxapi/tinxapi/secrets.py
      - ./:/tinx
    environment:
      - DB_HOST=db
      - DB_NAME=${MYSQL_DATABASE:-tinx}
      - DB_USER=${DB_USER:-tinx_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-3306}
    env_file:
      - .env
    ports:
      - "${TINX_API_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  solr:
    image: solr:6.6.6
    volumes:
      - solr_data:/opt/solr/server/solr/mycores
      - ./tinxapi/managed-schema:/opt/solr/server/solr/configsets/basic_configs/conf/managed-schema:ro
    command: solr-precreate haystack /opt/solr/server/solr/configsets/basic_configs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8983/solr/haystack/admin/ping || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  ui:
    build:
      context: ../tinx-ui/
    depends_on:
      api:
        condition: service_healthy
      solr:
        condition: service_healthy
    volumes:
      - ../tinx-ui:/app
    env_file:
      - .env
    ports:
      - "${TINX_UI_HTTP_PORT:-8080}:8080"
    command: sh -c "npm i && npm run dev"

volumes:
  tinx-mysql-data:
  solr_data:
