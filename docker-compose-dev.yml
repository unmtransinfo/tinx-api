name: tinx-dev
services:
  tinx_ui:
    build:
      context: ../tinx-ui/
    volumes:
      - ../tinx-ui:/app
    env_file:
      - .env
    ports:
      - "${TINX_UI_HTTP_PORT:-8080}:8080"
    command: sh -c "npm i && npm run dev"
  tinx_api:
    build:
      context: .
    volumes:
      - ./tinxapi/tinxapi/secrets.example.py:/tinx/tinxapi/tinxapi/secrets.py
      - ./:/tinx
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=${MYSQL_DATABASE:-tinx}
      - DB_USER=${DB_USER:-tinx_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-3306}
    env_file:
      - .env
    ports:
      - "${TINX_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  solr:
    image: solr:6.6.6
    volumes:
      - solr_data:/opt/solr/server/solr/mycores
      - ./tinxapi/managed-schema:/opt/solr/server/solr/configsets/basic_configs/conf/managed-schema:ro
    command: solr-precreate haystack /opt/solr/server/solr/configsets/basic_configs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8983/solr/haystack/admin/ping || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  solr_data:
