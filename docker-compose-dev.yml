volumes:
  solr_data:
  static_files_tinx:
  certbot_var:
  certbot_acme:
services:
  tinx_ui:
    build:
      context: ../tinx-ui/
    command: sh -c "npm i && npm run dev"
    volumes:
      - static_files_tinx:/app/dist:rw
      - ../tinx-ui:/app
    env_file:
      - .env
    ports:
      - ${TINX_UI_HTTP_PORT:-8080}:8080
  tinx_api:
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_USER=tcrd_read_only
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./tinxapi/tinxapi/secrets.example.py:/tinx/tinxapi/tinxapi/secrets.py
      - ./:/tinx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
  nginx:
    image: nginx:1
    volumes:
      - static_files_tinx:/usr/share/nginx/html:ro
      - ./nginx-local.conf:/etc/nginx/nginx.conf:ro
      - ./certbot:/etc/letsencrypt:ro
      - certbot_acme:/var/www/certbot:ro
    ports:
      - ${TINX_NGINX_SSL_PORT:-443}:443
      - ${TINX_NGINX_HTTP_PORT:-80}:80
    depends_on:
      tinx_api:
        condition: service_started
    env_file:
      - .env
  mysql:
    image: mysql:8.0.35
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_USER=tcrd_read_only
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=tcrd
      - MYSQL_RANDOM_ROOT_PASSWORD=true
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 20
    volumes:
      - ${DATABASE_VOLUME_PATH:-./db}:/var/lib/mysql
  solr:
    image: docker:latest
    volumes:
      - ./:/work
      - /var/run/docker.sock:/var/run/docker.sock
    command: ['sh', '-c', 'chmod +x /work/redeploy-solr.sh && sh /work/redeploy-solr.sh && sleep infinity']
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "! curl -s -k --max-time 14 --connect-timeout 9 https://newdrugtargets.org:8983/solr/admin || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 15s
    depends_on:
      tinx_api:
        condition: service_started
